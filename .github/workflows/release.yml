name: Signed alpha release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Verify tag and install signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          build=pathlib.Path('app/build.gradle.kts').read_text()
          version=re.search(r'versionName = "([^"]+)"',build).group(1)
          assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag does not match app version'
          PY
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Validate and build signed APK
        run: ./gradlew :core:protocol:test testDebugUnitTest lintDebug assembleRelease --console=plain
      - name: Package and verify release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Okuyuki-android-${{ github.ref_name }}.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/signature.txt
          cp docs/RELEASE-NOTES.md dist/release-notes.md
          cp docs/third-party/* dist/
          curl --fail --location --retry 3 https://codeload.github.com/strukturag/libheif/tar.gz/refs/tags/v1.23.6 -o dist/libheif-1.23.6-source.tar.gz
          curl --fail --location --retry 3 https://codeload.github.com/strukturag/libde265/tar.gz/refs/tags/v1.1.3 -o dist/libde265-1.1.3-source.tar.gz
          echo 'c9a00b0452f5c16d72ef71e5e40c0e90fbe2ad37148d27a1b2f9bb21546f5f03  dist/libheif-1.23.6-source.tar.gz' | sha256sum --check
          echo '189baa08fd6d2dd34db099de411bd6b2e6bd5eb88e81236a3d0fa3826b9715c4  dist/libde265-1.1.3-source.tar.gz' | sha256sum --check
          python3 scripts/release_manifest.py dist
          (cd dist && sha256sum *.apk *.tar.gz > SHA256SUMS.txt)
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "Okuyuki android $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-validation
          path: |
            **/build/reports/
            dist/
          retention-days: 14
